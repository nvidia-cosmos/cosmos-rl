name: build-doc
on:
  push:
    branches:
      - main
  pull_request:
    branches: [ "**" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install pydantic sphinx-autobuild  sphinx_rtd_theme recommonmark sphinx_markdown_tables sphinx-argparse sphinx-jsonschema

      - name: Build Sphinx docs
        run: |
          cd docs
          make html
          python - <<'PY'
          from pathlib import Path
          output = Path('_build/html')
          assert (output / 'execution_workflows.html').is_file(), 'Execution guide was not rendered'
          assert 'href="execution_workflows.html"' in (output / 'index.html').read_text(), 'Execution guide is missing from navigation'
          schema = (output / 'quickstart/configuration.html').read_text()
          assert 'ExecutionConfig' in schema and '<p>execution</p>' in schema, 'Execution schema was not rendered'
          PY

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
