# Independent frozen actor; original rollout likelihoods define the ratio.
# cosmos-rl --config configs/execution/independent-actor.toml
mode = "disaggregated"

[execution]
path = "train_from_generation"

[execution.actor]
weight_source = "checkpoint"
model_name_or_path = "Qwen/Qwen2.5-0.5B-Instruct"

[train]
output_dir = "./outputs/independent-actor"
epoch = 1
max_num_steps = 2
compile = false
train_batch_per_replica = 4

[train.train_policy]
type = "grpo"
use_rollout_logprobs_for_loss = true
on_policy = false
max_retry_for_on_policy = -1
dataset.name = "openai/gsm8k"
dataset.subset = "main"
dataset.split = "train"
prompt_column_name = "question"
response_column_name = "answer"
reward_function = "gsm8k"
mini_batch = 1

[policy]
model_name_or_path = "Qwen/Qwen2.5-0.5B-Instruct"
model_max_length = 1024

[rollout]
backend = "vllm"
batch_size = 1
n_generation = 2
max_response_length = 256

[logging]
logger = []

[policy.parallelism]
tp_size = 1

[rollout.parallelism]
tp_size = 1
