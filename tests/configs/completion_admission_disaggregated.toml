# Companion-backed live canary; run from the companion repository root.
mode = "disaggregated"

redis = "12818"
[custom]
payload_transfer = "nccl"
max_steps = 10
dt = 0.1
parallel_episodes = 1
gpu_pool_size = 1
nccl_prefetch_timeout = 30.0
nccl_recv_timeout = 5.0
[train]
output_dir = "/tmp/completion-admission-canary"
non_text = true
train_batch_per_replica = 2
epoch = 2
max_num_steps = 20
optm_name = "AdamW"
optm_lr = 0.001
optm_impl = "fused"
master_dtype = "float32"
param_dtype = "float32"
fsdp_reduce_dtype = "float32"
sync_weight_interval = 1
[train.train_policy]
type = "grpo"
algo = "admission_canary"
trainer_type = "simple_rl_trainer"
rollout_as_token_ids = false
allowed_outdated_steps = 0
on_policy = true
temperature = 1.0
epsilon_low = 0.1
epsilon_high = 1.0
kl_beta = 0.01
[train.train_policy.dataset]
name = "data/rl_gym_synthetic_bench"
split = ["train"]
test_size = 0.0
[train.ckpt]
enable_checkpoint = false
[train.scheduler]
name = "constant"
[logging]
logger = ["console"]
[validation]
enable = false
[rollout]
completion_admission = true
n_generation = 1
batch_size = 2
backend = "modular_rollout"
async_r2r_sync = "disabled"
[rollout.parallelism]
tp_size = 1
pp_size = 1
[policy]
model_name_or_path = "configs/models/simple_mlp.toml"
[policy.parallelism]
tp_size = 1
pp_size = 1
dp_shard_size = 1
dp_replicate_size = 1
