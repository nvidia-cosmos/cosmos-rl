# Run from the RL-Gym companion root with tests/requested_stop_canary.py.
mode = "colocated"
redis = "12808"

[custom]
payload_transfer = "nccl"
parallel_episodes = 2
max_steps = 10
nccl_max_steps = 10
dt = 0.1
gpu_pool_size = 1

[train]
output_dir = "/tmp/stop-colocated-checkpoints"
non_text = true
train_batch_per_replica = 2
resume = false
epoch = 1
max_num_steps = 8
optm_name = "AdamW"
optm_lr = 0.001
optm_warmup_steps = 0
param_dtype = "float32"
master_dtype = "float32"
fsdp_reduce_dtype = "float32"
compile = false
sync_weight_interval = 1

[train.train_policy]
type = "grpo"
trainer_type = "stop_canary_trainer"
rollout_as_token_ids = false
allowed_outdated_steps = 1
kl_beta = 0.0
prompt_column_name = "prompt"
response_column_name = "completion"

[train.train_policy.dataset]
name = "data/rl_gym_synthetic_bench"
split = ["train"]

[train.ckpt]
enable_checkpoint = true
save_freq = 100
save_mode = "sync"

[logging]
logger = ["console"]

[validation]
enable = true
val_before_train = true
freq = 1

[validation.dataset]
name = "data/rl_gym_synthetic_bench"
split = ["val"]

[rollout]
backend = "modular_rollout"
n_generation = 1
batch_size = 2
max_response_length = 512

[rollout.parallelism]
n_init_replicas = 1
tp_size = 1
pp_size = 1

[policy]
model_name_or_path = "configs/models/simple_mlp.toml"

[policy.parallelism]
tp_size = 1
cp_size = 1
pp_size = 1
dp_shard_size = 1
dp_replicate_size = 1
